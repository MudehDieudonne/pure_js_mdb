<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="./src/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie DB</title>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">Logo</div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Movies</a></li>
        <li><a href="#">TV Shows</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <div class="search">
        <form id="form">
          <input type="text" class="input" placeholder="Search...">
        </form>
        <button class="btn">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
          </svg>
        </button>
      </div>
    </nav>

    <!--Slider Hero-->
    <div class="hero-slider">
      <div class="hero-list">
        <!--Dynamicaly fetched data-->
      </div>
      <!--BUtton nav-->
      <div class="arrows">
        <button id="prev">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/>
          </svg>
        </button>
        <button id="next">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/>
          </svg>          
        </button>
      </div>
      <!--Thumbnail-->
      <div class="thumbnail">
        <!--Dynamically fetched data-->
      </div>
    </div>

    <!--popular of the week-->
    <section id="popular-week" class="popular-week">
      <h2>Popular of the Week</h2>
      <div class="movie-container">
        container card
      </div>
    </section>

    <section id="just-released" class="just-released">
      <h2>Just Released</h2>
      <div class="upcoming-movie-container">
           
      </div>
    </section>

   <section id="your-watch-list" class="your-watch-list">
      <h2>Your Watch List</h2>
      <div class="watchlist-movie-container">
           
      </div>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
